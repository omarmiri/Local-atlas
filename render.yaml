services:
  - type: web
    name: local-atlas
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      # Basemap tiles, proxied through /api/basemap-tile so the key stays off
      # the client. CARTO now watermarks keyless tiles with "API KEY REQUIRED"
      # baked into the image. BASEMAP_PROVIDER is stadia (default) or carto;
      # with no key set, the server falls back to keyless Esri, which only
      # tiles to zoom 16.
      - key: BASEMAP_API_KEY
        sync: false
      - key: BASEMAP_PROVIDER
        value: stadia
      - key: FSQ_API_KEY
        sync: false
      # CALL-E "Ask the Place". CALLE_WEBHOOK_TOKEN is any long random string:
      # webhook deliveries are unsigned, so it is what makes the callback URL
      # unguessable. CALLE_DRY_RUN=1 exercises the whole flow and places no
      # call — it overrides the key and the access code, and blocks every
      # credentialed request, so it is safe to set on a deploy that has both.
      - key: CALLE_API_KEY
        sync: false
      - key: CALLE_WEBHOOK_TOKEN
        generateValue: true
      - key: CALLE_DAILY_CALL_BUDGET
        value: "25"
