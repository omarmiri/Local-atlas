services:
  - type: web
    name: local-atlas
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: FSQ_API_KEY
        sync: false
      # CALL-E "Ask the Place". CALLE_WEBHOOK_TOKEN is any long random string:
      # webhook deliveries are unsigned, so it is what makes the callback URL
      # unguessable. CALLE_DRY_RUN=1 exercises the whole flow and places no
      # call — it overrides the key and the access code, and blocks every
      # credentialed request, so it is safe to set on a deploy that has both.
      - key: CALLE_API_KEY
        sync: false
      - key: CALLE_WEBHOOK_TOKEN
        generateValue: true
      - key: CALLE_DAILY_CALL_BUDGET
        value: "25"
